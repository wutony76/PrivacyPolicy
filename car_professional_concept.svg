<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Professional Offroad Hypercar Concept</title>
  <desc id="desc">A professional concept vehicle blending military offroad strength with futuristic hypercar aerodynamics.</desc>

  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfe7f2"/>
      <stop offset="45%" stop-color="#c3cfdf"/>
      <stop offset="100%" stop-color="#a8b7cb"/>
    </linearGradient>

    <radialGradient id="spotLeft" cx="20%" cy="22%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spotRight" cx="82%" cy="26%" r="44%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="floorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c9db4"/>
      <stop offset="100%" stop-color="#65778e"/>
    </linearGradient>

    <linearGradient id="bodyPaint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b2330"/>
      <stop offset="30%" stop-color="#2f3a4b"/>
      <stop offset="65%" stop-color="#424d5f"/>
      <stop offset="100%" stop-color="#1f2734"/>
    </linearGradient>

    <linearGradient id="armorPaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#586572"/>
      <stop offset="100%" stop-color="#262f3a"/>
    </linearGradient>

    <linearGradient id="accentPaint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4001d"/>
      <stop offset="45%" stop-color="#ff3f34"/>
      <stop offset="100%" stop-color="#a30019"/>
    </linearGradient>

    <linearGradient id="glassPaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7f1ff" stop-opacity="0.88"/>
      <stop offset="45%" stop-color="#8fc9f5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3e77ab" stop-opacity="0.44"/>
    </linearGradient>

    <linearGradient id="tirePaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2029"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>

    <radialGradient id="rimPaint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3f7ff"/>
      <stop offset="45%" stop-color="#c5d2e2"/>
      <stop offset="100%" stop-color="#7f8fa3"/>
    </radialGradient>

    <linearGradient id="headlampGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4ffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#89f2ff" stop-opacity="0.18"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-40%" width="170%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset dx="0" dy="18" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bodyGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grillePattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6 H12 M6 0 V12" stroke="#1b2029" stroke-width="1.5" opacity="0.45"/>
    </pattern>

    <path id="bodyShell" d="M140 486 L208 352 C280 258 426 210 652 196 L940 186 C1088 182 1210 230 1310 324 L1400 406 L1362 470 L1186 480 C1048 490 944 510 842 532 L336 532 C244 532 188 516 140 486 Z"/>
    <path id="cabinShell" d="M458 334 C518 246 640 198 804 188 L972 182 C1066 178 1142 214 1212 274 L1268 332 L1248 358 L530 366 Z"/>
    <path id="windowShell" d="M516 332 C568 266 672 224 816 216 L958 210 C1038 206 1098 234 1152 286 L1196 330 L1188 342 L568 348 Z"/>
    <clipPath id="bodyClip">
      <use href="#bodyShell"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGradient)"/>
  <rect width="1600" height="900" fill="url(#spotLeft)"/>
  <rect width="1600" height="900" fill="url(#spotRight)"/>

  <path d="M0 590 L1600 590 L1600 900 L0 900 Z" fill="url(#floorGradient)"/>
  <path d="M0 602 C330 568 620 558 800 560 C1010 562 1290 574 1600 616 L1600 900 L0 900 Z"
        fill="#6f8098" opacity="0.45"/>
  <path d="M0 650 C310 620 620 612 800 614 C1010 616 1280 632 1600 668"
        stroke="#91a3bb" stroke-width="2" fill="none" opacity="0.45"/>

  <g transform="translate(40 78)" filter="url(#softShadow)">
    <ellipse cx="760" cy="548" rx="560" ry="74" fill="#2f3b4b" opacity="0.45"/>
    <ellipse cx="760" cy="558" rx="462" ry="56" fill="#1e2732" opacity="0.3"/>

    <use href="#bodyShell" fill="url(#bodyPaint)" stroke="#101722" stroke-width="4"/>
    <use href="#cabinShell" fill="url(#armorPaint)" stroke="#1a202a" stroke-width="4"/>
    <use href="#windowShell" fill="url(#glassPaint)" stroke="#bde7ff" stroke-opacity="0.46" stroke-width="2.5"/>

    <g clip-path="url(#bodyClip)">
      <path d="M170 450 C350 370 500 415 660 350 C840 278 1064 356 1322 288"
            stroke="url(#accentPaint)" stroke-width="42" fill="none" stroke-linecap="round" opacity="0.96"/>
      <path d="M150 404 C340 332 522 374 676 316 C868 244 1082 320 1338 264"
            stroke="#c2d0de" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.33"/>
      <path d="M230 503 C390 448 612 468 770 430 C930 392 1052 412 1210 386"
            stroke="#8a9db4" stroke-width="8" fill="none" opacity="0.4"/>
      <path d="M196 488 C410 426 630 450 816 396 C990 346 1128 354 1300 330"
            stroke="#e5edf8" stroke-width="4" fill="none" opacity="0.58"/>
    </g>

    <path d="M220 462 C330 454 430 444 536 426 C662 404 784 374 910 344 C1038 312 1160 302 1306 300"
          stroke="#f4f7fd" stroke-opacity="0.28" stroke-width="3" fill="none"/>

    <path d="M476 354 L1238 346" stroke="#d2deed" stroke-opacity="0.34" stroke-width="2"/>
    <path d="M870 214 L864 352" stroke="#d1e2f4" stroke-opacity="0.4" stroke-width="2"/>

    <path d="M1362 470 L1450 446 L1418 426 L1364 430 Z"
          fill="#1b2634" stroke="#131d29" stroke-width="3"/>
    <rect x="1386" y="430" width="58" height="18" rx="5" fill="url(#headlampGlow)" filter="url(#bodyGlow)"/>

    <path d="M146 458 L112 456 L84 446 L90 420 L136 424 Z"
          fill="#222d3a" stroke="#121a26" stroke-width="3"/>
    <rect x="92" y="428" width="46" height="14" rx="4" fill="#d7f8ff" opacity="0.84"/>

    <path d="M210 444 L314 440 L342 470 L188 474 Z" fill="url(#grillePattern)" opacity="0.74"/>
    <path d="M350 300 L428 292 L488 332 L400 338 Z" fill="#2b3644" opacity="0.65"/>

    <g>
      <path d="M694 180 L774 176 L826 206 L740 208 Z" fill="#242f3f"/>
      <rect x="700" y="165" width="154" height="15" rx="4" fill="#1a222f"/>
      <rect x="708" y="156" width="20" height="10" rx="2" fill="#252f3f"/>
      <rect x="825" y="156" width="20" height="10" rx="2" fill="#252f3f"/>
    </g>

    <g>
      <path d="M238 532 C256 470 298 434 360 430 C426 426 470 464 488 532"
            fill="#111722" opacity="0.7"/>
      <path d="M856 532 C874 470 916 434 978 430 C1044 426 1088 464 1106 532"
            fill="#111722" opacity="0.7"/>
    </g>

    <g transform="translate(362 532)">
      <circle r="112" fill="url(#tirePaint)" stroke="#020407" stroke-width="7"/>
      <circle r="80" fill="#111a28" stroke="#39485e" stroke-width="6"/>
      <circle r="56" fill="url(#rimPaint)" stroke="#deebfb" stroke-opacity="0.45" stroke-width="2"/>
      <circle r="16" fill="#eef5ff"/>
      <g stroke="#8595ac" stroke-width="5" stroke-linecap="round" opacity="0.85">
        <path d="M0 -16 L0 -54"/>
        <path d="M16 0 L54 0"/>
        <path d="M0 16 L0 54"/>
        <path d="M-16 0 L-54 0"/>
        <path d="M11 -11 L38 -38"/>
        <path d="M11 11 L38 38"/>
        <path d="M-11 11 L-38 38"/>
        <path d="M-11 -11 L-38 -38"/>
      </g>
    </g>

    <g transform="translate(980 532)">
      <circle r="112" fill="url(#tirePaint)" stroke="#020407" stroke-width="7"/>
      <circle r="80" fill="#111a28" stroke="#39485e" stroke-width="6"/>
      <circle r="56" fill="url(#rimPaint)" stroke="#deebfb" stroke-opacity="0.45" stroke-width="2"/>
      <circle r="16" fill="#eef5ff"/>
      <g stroke="#8595ac" stroke-width="5" stroke-linecap="round" opacity="0.85">
        <path d="M0 -16 L0 -54"/>
        <path d="M16 0 L54 0"/>
        <path d="M0 16 L0 54"/>
        <path d="M-16 0 L-54 0"/>
        <path d="M11 -11 L38 -38"/>
        <path d="M11 11 L38 38"/>
        <path d="M-11 11 L-38 38"/>
        <path d="M-11 -11 L-38 -38"/>
      </g>
    </g>

    <path d="M448 536 L670 536 C676 536 682 540 685 546 C692 560 705 568 728 570 L842 570 C863 568 878 560 884 546 C887 540 893 536 899 536 L1112 536"
          stroke="#cfd9e8" stroke-opacity="0.24" stroke-width="4" fill="none"/>
  </g>

  <g opacity="0.2">
    <path d="M352 668 C560 694 1042 700 1278 680 C1060 708 558 706 330 680 Z" fill="#dce6f3"/>
  </g>
</svg>
